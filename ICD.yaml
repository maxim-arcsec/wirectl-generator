          reset_value: 0
  - TmLog1:
      id: 3
      description: Telemetry log settings
      fields:
      - counter_source:
          type: u8
          reset_value: 0
          description: Source of the counter for the logging (0=disabled, 1=ticks, 2=time, 3=tm_update_count)
      - counter_source_diff_since_last:
          type: u32
          reset_value: 0
          description: Log tm if the difference between new counter_source value and previous one is grated than this parameter  
      - counter_source_minimum:
          type: u32
          reset_value: 0
          description: Minimum counter_source value to start logging
      - counter_source_maximum:
          type: u32
          reset_value: 0
          description: Maximum counter_source value to stop logging
      - match_tm_id: 
          type: u8
          reset_value: 0
          description: Telemetry ID that should match a certain condition to start logging
      - match_tm_field: 
          type: u8
          reset_value: 0
          description: Field number of the telemetry that should match certain condition to log
      - match_tm_condition:
          type: u8
          reset_value: 0
          description: "Condition the telemetry should match to log (0:disabled, 1:=, 2:!=, 3:>, 4:<, 5:>=, 6:<=)"
      - match_tm_value:
          type: u32
          reset_value: 0
          description: Value the telemetry should match to log
      - tm1_to_log:
          type: u8
          reset_value: 0
          description: ID of the first telemetry to log
      - tm2_to_log:
          type: u8
          reset_value: 0
          description: ID of the second telemetry to log
      - tm3_to_log:
          type: u8
          reset_value: 0
          description: ID of the third telemetry to log
      - tm4_to_log:
          type: u8
          reset_value: 0
          description: ID of the fourth telemetry to log
      - file_id:
          type: u8
          reset_value: 0
          description: File ID number to indicate the slot number where log should be stored
      - circular: 
          type: u8
          reset_value: 0
          description: Automatically restart at the beginning if the file is full (0=Off, 1=On)
