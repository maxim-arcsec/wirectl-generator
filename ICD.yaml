      - saviCount:
          type: u32
      - eaviCount:
          type: u32
  - MCUTemperature:
      id: 9
      communication_timeout_ms: 10
      fields:
      - value:
          type: s16
          description: MCU temperature in deg C
  - PCBTemperature:
      id: 10
      communication_timeout_ms: 10
      fields:
      - value:
          type: f32
          description: PCB temperature measured on temperature sensor
  - Current:
      id: 11
      communication_timeout_ms: 10
      fields:
      - value:
