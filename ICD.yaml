  - LISA:
      id: 25
      description: LISA Parameters
      communication_timeout_ms: 10
      fields:
      - mode:
          type: u8
          description: 0=LISA12, 1=fastLISA6, 2=fastLISA6-8, 3=fastLISA6-8-LISA12
          reset_value: 3
      - prefilterDistThreshold:
          type: f32
          description: Threshold on the star triplet distance in the LISA prefilter
          reset_value: 0.05
      - prefilterAngleThreshold:
          type: f32
          description: Threshold on the star triplet angles in the LISA prefilter
          reset_value: 0.025
      - fovWidth:
          type: f32
          description: Field of view in the horizontal direction
          reset_value: 0.18506995
      - fovHeight:
          type: f32
          description: Field of view in the vertical direction
          reset_value: 0.18506995
      - floatStarLimit:
          type: f32
          description: Minimum distance of the second closest star. Double stars will
            be discarded
          reset_value: 0.05
      - closeStarLimit:
          type: f32
          description: Maximum distance between two stars to be considered as close stars
          reset_value: 0.05
      - rateCloseStarCount:
          type: f32
          description: Weight given to the number of close stars in determining the
            best match
          reset_value: 100
      - rateFractionclose:
          type: f32
          description: Weight given to the fraction of close stars in determining
            the best match
          reset_value: 10  
      - rateMeanSum:
          type: f32
          description: Weight given to the mean star distance in determining the best
            match
          reset_value: 0  
      - rateDBStarCount:
          type: f32
          description: Weight given to the number of database stars in determining
            the best match
          reset_value: 0  
      - maxCombinations:
          type: u8
          description: Maximum number of stars to use for triplet generation
          reset_value: 12
      - nrStarsStop:
          type: u8
          description: Minimum number of matched stars needed to stop the LISA algorithm
          reset_value: 5
      - fractionCloseStop:
          type: f32
          description: Minimum fraction close value to stop the LISA algorithm
          reset_value: 0.5
      - fastLISALimitAngle:
          type: f32
          description: "dummy value for future use: limit_ang for fastLISA sorted db"
          reset_value: 0.1
      - fastLISALimitDistance:
          type: f32
          description: "dummy value for future use: limit_dist for fastLISA sorted db"
          reset_value: 0.2
  - Matching:
      id: 26
      description: Matching Parameters
      communication_timeout_ms: 10
      fields:
      - focalLength:
          type: f32
          unit: mm
          description: Focal length of the star tracker
          reset_value: 16
      - squaredDistanceLimit:
          type: f32
          description: Threshold on the squared distance in the matching algorithm
          reset_value: 0.003025
      - squaredShiftLimit:
          type: f32
          description: Threshold on the squared shift distance in the matching algorithm
          reset_value: 0.0484
  - Tracking:
      id: 27
      communication_timeout_ms: 10
      fields:
      - outlierThreshold:
          type: f32
          description: If the distance between matched and tracked stars is too high,
            that star pair is discarded
          reset_value: 0.00027225
      - outlierThresholdQUEST:
          type: f32
          description: If the distance between matched and tracked stars is too high,
            that star pair is discarded
          reset_value: 0.0005
      - trackerChoice:
          type: u8
          description: Choose which tracker to use (0=QUEST, 1=AIM, 2=AIMRobust,
            3=QUESTRobust)
          reset_value: 2
      - weightingMode:
          type: u8
          description: Choose which weighting mode to use (not implemented yet)
          reset_value: 0
      - rateEstimationMode:
          type: u8
          description: Choose which rate estimation mode to use (not implemented yet)
          reset_value: 0
  - Validation:
      id: 28
      communication_timeout_ms: 10
      fields:
      - stableCount:
          type: u8
          description: Minimum number of validated ST solutions before the quaternion
            is flagged as OK
          reset_value: 5
      - maxDifference:
          type: f32
          description: Maximum angular difference between the consecutive ST solutions
            to validate the quaternion
          reset_value: 0.4
      - minTrackerConfidence:
          type: f32
          description: Minimum confidence of the tracker solution to validate the
            quaternion
          reset_value: 1.0e-4
      - minMatchedStars:
          type: u8
          description: Minimum number of matched stars to validate the quaternion
          reset_value: 5
  - Algo:
      id: 29
      communication_timeout_ms: 10
      fields:
      - mode:
          type: u8
          description: 0=IDLE, 6=BLOB, 7=CENTROID, 8=LISA, 9=TURBOCENTROID, 10=TRACK, 11=LISATRACK, 12=AUTO
          reset_value: 0
      - l2t_minConfidence:
          type: f32
          description: Minimum confidence of tracker solution to enter tracking
            mode
          reset_value: 1.0e-4
      - l2t_minMatched:
          type: u8
          description: Minimum number of matched stars to enter tracking mode
          reset_value: 5
      - t2l_minConfidence:
          type: f32
          description: Minimum confidence of tracker solution to stay in tracking
            mode
          reset_value: 1.0e-4
      - t2l_minMatched:
          type: u8
          description: Minimum number of matched stars to stay in tracking mode
          reset_value: 5
  - Mounting:
      id: 30
      description: Normalized mounting quaternion (from body to local frame) to convert the ST quaternion to the
        spacecraft frame
      communication_timeout_ms: 10
      fields:
      - qw:
          type: f32
          unit: quat
          description: Mounting quaternion qw
          reset_value: 1
      - qx:
          type: f32
          unit: quat
          description: Mounting quaternion qx
          reset_value: 0
      - qy:
          type: f32
          unit: quat
          description: Mounting quaternion qy
          reset_value: 0
      - qz:
          type: f32
          unit: quat
          description: Mounting quaternion qz
          reset_value: 0
  - BlobFilter:
      id: 31
      fields:
      - max_oflow:
          type: u64
          description: Maximum overflow setting for each region
          reset_value: 1306345300161532449
      - max_open:
          type: u64
          description: Maximum open setting for each region
          reset_value: 2612728130319950914
      - max_simopen:
          type: u64
          description: Maximum simultanious open setting for each region
          reset_value: 2612728130319950914
      - max_valid:
          type: u64
          description: Maximum valid setting for each region
          reset_value: 2612728130319950914
      - desired:
          type: u64
          description: Desired number of blobs for each region
          reset_value: 1306365233408905761
      - max_width:
          type: u8
          description: Maximum blob width
          reset_value: 5
      - max_height:
          type: u8
          description: Maximum blob height
          reset_value: 5
      - max_count:
          type: u8
          description: Maximum pixel count
          reset_value: 5
      - noise_limit1:
          type: u16
          description: Noise threshold 1 for blob detection
          reset_value: 5
      - noise_limit2:
          type: u16
          description: Noise threshold 2 for blob detection
          reset_value: 0
      - noise_min:
          type: u16
          description: Minimum value
          reset_value: 2
      - noise_max:
          type: u16
          description: Maximum value
          reset_value: 65535
      - Kp:
          type: f32
          description: Kp value for the blob filter
          reset_value: 1
      - bin_mode:
          type: u8
          description: bin_mode
          reset_value:  0
- additional_parameters: []
- actions:
  - Ping:
      id: 1
      description: Pings remote device. The result of this action is an action reply
        with the same id.
      boot: true
      run: true
      communication_timeout_ms: 10
      req_fields:
      - id:
          type: u32
          description: Ping ID
      res_fields:
      - id:
          type: u32
          description: Same ID as in request
  - Boot:
      id: 2
      description: Boot the star tracker.
      boot: true
      run: false
      req_fields:
      - region:
          type: u8
          description: "Image to boot: 0=bootloader, 1=main firmware, 2=backup firmware"
      res_fields: []
  - Write:
      id: 3
      description: Writes provided data to the remote device's FLASH memory
      boot: true
      run: false
      communication_timeout_ms: 60
      req_fields:
      - region:
          type: u8
          description: Region to which the data needs to be written
      - address:
          type: u32
          description: Address of the FLASH memory to which the data has to be written
      - length:
          type: u16
          description: Length of the data to be written (limited to max. 1024 bytes)
      - data:
          type: u8[1024]
          description: Raw data to write
      res_fields:
      - region:
          type: u8
          description: Same as in request
      - address:
          type: u32
          description: Same as in request
      - length:
          type: u16
          description: Same as in request
  - Read:
      id: 4
      description: Reads remote device's FLASH memory
      boot: true
      run: false
      communication_timeout_ms: 130
      req_fields:
      - region:
          type: u8
          description: Region in which the data to be read is stored
      - address:
          type: u32
          description: Flash memory address where to read
      - length:
          type: u16
          description: Length of the block to be read (limited to max. 1024 bytes)
      res_fields:
      - region:
          type: u8
      - address:
          type: u32
          description: Same as in request
      - length:
          type: u16
          description: Same as in request
      - data:
          type: u8[1024]
          description: Read data
  - Checksum:
      id: 5
      description: Calculate the checksum of part of the FLASH memory
      boot: true
      run: false
      communication_timeout_ms: 170
      req_fields:
      - region:
          type: u8
          description: Region in which the data for the checksum calculation is stored
      - address:
          type: u32
          description: Address from which the checksum calculation will start
      - length:
          type: u32
          description: Length of the data block
      res_fields:
      - region:
          type: u8
          description: Same as in request
      - address:
          type: u32
          description: Same as in request
      - length:
          type: u32
          description: Same as in request
      - checksum:
          type: u32
          description: Requested checksum
  - Erase:
      id: 6
      description: Erase region of the FLASH memory
      boot: true
      run: false
      communication_timeout_ms: 15000
      req_fields:
      - region:
          type: u8
          description: Region to be erased
      res_fields:
      - region:
          type: u8
          description: Same as in request
  - Unlock:
      id: 7
      description: Unlock the region. After this, the region can be written to and/or erased
      boot: true
      run: false
      req_fields:
      - region:
          type: u8
          description: Region to be unlocked
      - code:
          type: u32
          description: Secret code for unlocking the region
      res_fields: []
  - Reboot:
      id: 8
      description: Reboots the remote device
      req_fields: []
      res_fields: []
  - Download:
      id: 9
      description: Download part of the star image. Only returns first 1024 bytes.
        To read more bytes, call multiple times.
      boot: false
      run: true
      req_fields:
      - position:
          type: u32
          description: Start position in the star tracker image to be downloaded
      res_fields:
      - position:
          type: u32
          description: Same as in request
      - data:
          type: u8[1024]
          description: Requested image data
  - Upload:
      id: 10
      description: Upload part of the star image to the buffer.
      boot: false
      run: true
      req_fields:
      - position:
          type: u32
          description: Start position in the star tracker image to be uploaded
      - data:
          type: u8[1024]
          description: Image data to be uploaded
      res_fields:
      - position:
          type: u32
          description: Same as in request
  - ResetErrorSignal:
      id: 11
      boot: false
      run: true
      req_fields: []
      res_fields: []
  - SetTime:
      id: 12
      description: Set time on remote product
      boot: true
      run: true
      req_fields:
      - unixTime:
          type: u64
          unit: milliseconds
          description: unix time in milliseconds
      res_fields: []
  - ResetFrameCounter:
      id: 15
      description: Reset the frame counter
      req_fields: []
      res_fields: []
  - GetCurrentTime:
      id: 16
      description: Requests current MCU time and ticks
      req_fields: []
      res_fields:
      - time:
          type: u64
          unit: microseconds
          description: Unix time in microseconds
      - ticks:
          type: u32
          description: Ticks since boot
  - ResetSimulator:
      id: 19
      description: Reset the simulator
      req_fields: []
      res_fields: []
  - GetFileInfo:
      id: 20
      description: Gets file information
      boot: true
      run: true
      communication_timeout_ms: 120
      req_fields:
      - target:
          type: u8
          description: Target
      - slot:
          type: u16
          description: Slot in the specified target
      res_fields:
      - is_locked:
          type: u8
          description: Flag indicating if the file is locked
      - used_size:
          type: u32
          description: Used size of the file (If file is empty this will be same as size parameter)
      - max_size:
          type: u32
          description: Maximum available size of file (Always returns max value regardless is file is populated or not)
      - current_mode:
          type: u32
          description: Current mode (0x40000000 = read mode, 0x80000000 = write mode, 0x00000000 = file closed)
      - supported_modes:
          type: u32
          description: Returns supported modes of the specified file
  - OpenFile:
      id: 21
      description: Opens file for reading/writing on remote product
      boot: true
      run: true
      communication_timeout_ms: 5000
      req_fields:
      - target:
          type: u8
          description: Target
      - slot:
          type: u16
          description: Slot in the specified target
      - mode:
          type: u32
          description: Open file in desired mode (0x40000000 = read mode, 0x80000000 = write mode)
      - unlock_code:
          type: u32
          description: Code used for unlocking specific files prior to destructive operations
      res_fields: 
      - size:
          type: u32
          description: Size of the file that was just opened
  - CloseFile:
      id: 22
      description: Closes file on remote product
      boot: true
      run: true
      communication_timeout_ms: 500
      req_fields:
      - target:
          type: u8
          description: Target
      - slot:
          type: u16
          description: Slot in the specified target
      res_fields: []
  - WriteFile:
      id: 23
      description: Writes raw file data to product
      boot: true
      run: true
      communication_timeout_ms: 150
      req_fields:
      - target:
          type: u8
          description: Target
      - slot:
          type: u16
          description: Slot in the specified target
      - data:
          type: u8[1024]
          description: Buffer containing raw data we want to write
      - size:
          type: u32
          description: Size of the data we want to write
      - position:
          type: u32
          description: Incrementing number representing piece of data that is being sent
      res_fields: []
  - ReadFile:
      id: 24
      description: Reads raw file data from product
      boot: true
      run: true
      communication_timeout_ms: 2000
      req_fields:
      - target:
          type: u8
          description: Target
      - slot:
          type: u16
          description: Slot in the specified target
      - size:
          type: u32
          description: Size of the data we want to read
      - position:
          type: u32
          description: Incrementing number representing piece of data that is being read
      res_fields:
      - data:
          type: u8[1024]
          description: Buffer containing raw read data
  - ValidateFile:
      id: 25
      description: Validates file data by performing CRC using XXH32
      boot: true
      run: true
      communication_timeout_ms: 2000
      req_fields:
      - target:
          type: u8
          description: Target
      - slot:
          type: u16
          description: Slot in the specified target
      res_fields:
      - crc:
          type: u32
          description: Calculated CRC
  - TmLogAction:
      id: 26
      description: Action related to telemetry logging
      boot: false
      run: true
      communication_timeout_ms: 5000
      req_fields:
      - id:
          type: u8
          description: 0=Pause tm log, 1=Start tm log, 2=Clears the offset and erases data, 3=Clears the offset, does not erase data
      - opt1:
          type: u32
          description: Optional argument 1
      - opt2:
          type: u32
          description: Optional argument 2
      res_fields: []
  - TestAction:
      id: 28
      description: Test actions used for health tests of the device
      boot: false
      run: true
      communication_timeout_ms: 20000
      req_fields:
      - id:
          type: u32
          description: Test ID
      - opt1:
          type: u32
          description: Optional argument 1
      - opt2:
          type: u32
          description: Optional argument 2
      res_fields:
      - response:
          type: u32
          description: Test action response
- additional_actions: []
- telemetry:
  - Time:
      id: 1
      description: Time. Updated once per second.
      communication_timeout_ms: 10
      fields:
      - runtime:
          type: u32
          unit: milliseconds
          description: Number of milliseconds since processor start-up
      - unixTime:
          type: u64
          description: Current unix time in microseconds
  - Version:
      id: 2
      description: Firmware version
      communication_timeout_ms: 10
      fields:
      - program:
          type: u8
          description: 1=bootloader, 2=main firmware, 3=backup firmware
      - major:
          type: u8
          description: Major firmware version
      - minor:
          type: u8
          description: Minor firmware version
  - Interface:
      id: 3
      communication_timeout_ms: 10
      fields:
      - txSuccess:
          type: u32
          description: Successfully transmitted packets
      - rxSuccess:
          type: u32
          description: Successfully received packets
      - txError:
          type: u32
          description: Transmit errors (packets)
      - rxError:
          type: u32
          description: Receive errors, e.g. too large message
      - PackDrop:
          type: u32
          description: Dropped packets
      - AuthErr:
          type: u32
          description: Authentication errors (packets)
      - FrameErr:
          type: u32
          description: Frame format errors (packets)
      - txBytes:
          type: u32
          description: Transmitted bytes
      - rxBytes:
          type: u32
          description: Received bytes
  - ErrorSignal:
      id: 4
      description: 'Signals whether an error has occurred (1: Error, 0: OK)'
      communication_timeout_ms: 10
      fields:
      - errorSignal:
          type: u8
      - level:
          type: u8
          description: 8=error
      - ticks:
          type: u32
          description: Number of ticks since boot
      - cycles:
          type: u32
      - module:
          type: u8
      - msg:
          type: u8[64]
          description: Error message
  - LogMsg:
      id: 5
      communication_timeout_ms: 10
      fields:
      - level:
          type: u8
          description: 1 = debug, 2=info, 4=warn, 8=error
      - ticks:
          type: u32
          description: Number of ticks since boot
      - cycles:
          type: u32
      - module:
          type: u8
      - msg:
          type: u8[64]
  - DeviceId:
      id: 7
      communication_timeout_ms: 10
      fields:
      - D0:
          type: u32
          description: Internal device identifier
      - R0:
          type: u32
          description: Internal device identifier
      - U0:
          type: u32
          description: Internal device identifier
      - U1:
          type: u32
          description: Internal device identifier
      - U2:
          type: u32
          description: Internal device identifier
      - ref:
          type: u32
          description: Version ref
  - CameraStats:
      id: 8
      communication_timeout_ms: 10
      fields:
      - frameCount:
          type: u32
          description: Number of frames
      - savvCount:
          type: u32
      - eavvCount:
