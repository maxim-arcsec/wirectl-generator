          description: Electrical current value in mA
          unit: mA
  - Health:
     id: 12
     description: shows the health status of the device
     fields:
      - power_cycle_req: {type: u8, description: "0=No power cycle requested"}
      - power_cycle_time: {type: u8, description: "Minimal off time requested (ms)"}
      - power_cycle_reason: {type: u32, description: "Reason for power cycle"}
      - temp_mcu_probe: {type: u8, description: "0=Nominal, 1=Overtemperature"}
      - temp_sensor_probe: {type: s8, description: "Temperature of near image sensor"}
      - ts_probe: {type: u8, description: "Temperature sensor scrubber"}
      - sd_probe: {type: u8, description: "0=Nominal, 1=Blocked"}
      - sd_probe_nr_recover: {type: u16, description: "Nr of times tried to recover the image sensor"}
      - ss_probe: {type: u8, description: "Sensor scrub: 0=Nominal, 1=Error detected"}
      - ss_probe_nr_recover: {type: u16, description: "Nr of times tried to recover the image sensor scrubber"}
  - File:
