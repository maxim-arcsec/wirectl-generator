  - Subscription:
      id: 2
      description: Subscribes to telemetry and send it to address when it becomes
        available.
      communication_timeout_ms: 10
      fields:
      - cspAddress:
          type: u8
          description: CSP address to send the telemetry. 0 disables the functionality.
          reset_value: 0
      - cspPort:
          type: u8
          description: CSP port to send the telemetry
          reset_value: 0
      - telemetry1:
          type: u8
          reset_value: 0
      - telemetry2:
