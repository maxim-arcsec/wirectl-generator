  - Simulator:
      id: 7
      description: Parameters of the star tracker simulator tot simulate quaternions
      communication_timeout_ms: 10
      fields:
      - enable:
          type: u8
          description: Enable simulator updating star tracker quaternion telemetry
          reset_value: 0
      - interval:
          type: u32
          description: interval in ticks
          reset_value: 100
      - startqw:
          type: f32
          description: Start quaternion for the simulator
          reset_value: 1
      - startqx:
          type: f32
          description: Start quaternion for the simulator
          reset_value: 0
      - startqy:
          type: f32
          description: Start quaternion for the simulator
          reset_value: 0
      - startqz:
          type: f32
          description: Start quaternion for the simulator
          reset_value: 0
      - rotqw:
          type: f32
          description: Rotation quaternion to rotate the quaternion each time step
          reset_value: 0.998967520182253
      - rotqx:
          type: f32
          description: Rotation quaternion to rotate the quaternion each time step
          reset_value: 0.025166906133203
      - rotqy:
          type: f32
          description: Rotation quaternion to rotate the quaternion each time step
          reset_value: -0.03735412908133
      - rotqz:
          type: f32
          description: Rotation quaternion to rotate the quaternion each time step
          reset_value: 0.005932073598454
  - SafeLimits:
      id: 8
      description: Sets limits to the current and temperature of the star tracker.
        If a higher current is reached, the star tracker will be rebooted automatically.
        0=disable
      communication_timeout_ms: 10
      fields:
      - action:
          type: u8
          description: Limit action, 0=disable automatic reboot
          reset_value: 0
      - maxMCUTemp:
          type: f32
          unit: deg C
          description: Maximum temperature of for the microcontroller (in deg C)
          reset_value: 0
      - maxSensorTemp:
          type: f32
          unit: deg C
          description: Maximum temperature of the camera sensor (in deg C)
          reset_value: 0
      - maxCurrent:
          type: f32
          unit: A
          description: Maximum current for the microcontroller (in A)
          reset_value: 0
      - scrubbingInterval:
          type: u32
          description: Sensor scrubbing interval
          reset_value: 0
  - Camera:
      id: 20
      description: Camera sensor parameters
      communication_timeout_ms: 10
      fields:
      - state:
          type: u8
          unit: enum
          description: 0=enabled, 1=running
          reset_value: 0
      - mode:
          type: u8
          unit: enum
          description: 0=off, 1=idle, 2=lowres (download), 3=highres (download), 4=lowres (process), 5=highres (process), 6=highres1024 (download)
          reset_value: 0
      - exposure:
          type: f32
          unit: s
          description: Exposure/integration time of the camera sensor
          reset_value: 0
      - blacklevel:
          type: u16
          unit: pixel value
          description: Black level correction value
          reset_value: 0
      - gain:
          type: u8
          description: Gain
          reset_value: 0
      - highgain:
          type: u8
          unit: bool
          description: Enable/disable high gain mode
          reset_value: 0
  - ImageProcessor:
      id: 21
      communication_timeout_ms: 10
      fields:
      - mode:
          type: u8
          description: 0=off, 1=hist, 2=contrast, 3=blob, 4=hist_small, 5=blob_noprotectoflow, 6=debug(1-4), 7=blob_region, 8=blob_region_nofilter
          reset_value: 0
      - store:
          type: u8
          description: 0=direct processing, 1=store image (no processing)
          reset_value: 0
      - signalThreshold:
          type: u16
          description: Minimum value to consider group of 4x4 pixels as blob
          reset_value: 20
      - darkThreshold:
          type: u16
          description: NA (Not used in this version)
          reset_value: 100
      - backgroundcompensation:
          type: u8
          description: NA (Not used in this version)
          reset_value: 0
      - keep:
          type: u8
          description: NA (Not used in this version)
          reset_value: 0
      - keepframenr:
          type: u16
          description: Which frame number to keep
          reset_value: 8
      - keepfrom:
          type: u16
          description: Defines from which row to keep
          reset_value: 0
      - keepto:
          type: u16
          description: Defines to which row to keep
          reset_value: 0
  - AutoThreshold:
      id: 22
      description: Automatic threshold Parameters
      communication_timeout_ms: 10
      fields:
      - mode:
          type: u8
          unit: enum
          description: 0=off, 1=auto
          reset_value: 0
      - desiredBlobsCount:
          type: u8
          description: Number of desired blobs
          reset_value: 40
      - minThreshold:
          type: u16
          unit: pixel value
          description: Minimum limit on value to consider stars
          reset_value: 1
      - maxThreshold:
          type: u16
          unit: pixel value
          description: Maximum limit on value to consider stars
          reset_value: 1000
      - thresholdKp:
          type: f32
          description: Proportional gain of adaptive blob
          reset_value: 1e-1
  - Centroiding:
      id: 23
      description: Centroiding Parameters
      communication_timeout_ms: 10
      fields:
      - enableFilter:
          type: u8
          unit: bool
          description: NA (Not used in this version)
          reset_value: 0
      - maxquality:
          type: f32
          description: Maximum threshold on the quality index of centroiding filter
          reset_value: 9999
      - minquality:
          type: f32
          description: Minimum threshold on the quality index of centroiding filter
          reset_value: -9999
      - maxintensity:
          type: f32
          description: Maximum threshold on the star intensity of centroiding filter 
          reset_value: 9999
      - minintensity:
          type: f32
          description: Minimum threshold on the star intensity of centroiding filter
          reset_value: -9999
      - gaussianCmax:
          type: f32
          description: Threshold on the maximum value of the spread of centroiding filter
          reset_value: 9999
      - gaussianCmin:
          type: f32
          description: Threshold on the minimum value of the spread of centroiding filter
          reset_value: -9999
      - transmatrix00:
          type: f32
          description: Value (0,0) of the rotation matrix applied to the star centroids
          reset_value: -1
      - transmatrix01:
          type: f32
          description: Value (0,1) of the rotation matrix applied to the star centroids
          reset_value: 0
      - transmatrix10:
          type: f32
          description: Value (1,0) of the rotation matrix applied to the star centroids
          reset_value: 0
      - transmatrix11:
          type: f32
          description: Value (1,1) of the rotation matrix applied to the star centroids
          reset_value: 1
  - Distortion:
      id: 24
      description: Distortion parameters of the lens
