      - region43_error: {type: f32, description: "Average squared centroiding error wrt database image in region 43"}
      - region44_count: {type: u8,  description: "Number of matched centroids in region 44"}
      - region44_error: {type: f32, description: "Average squared centroiding error wrt database image in region 44"}
  - AlgoStatus:
      id: 38
      fields:
      - task:
          type: u32
          description: Currently being executed star tracker algorithm (0=IDLE, 1=START, 2=RESCALEBLOB, 3=CENTR, 4=LISA, 5=TRACK)
      - taskProgress:
          type: u32    
          description: Progress of the currently being executed star tracker algorithm
  - SolutionLISA:
      id: 39
      communication_timeout_ms: 10
      fields:
      - qw:
          type: f32
          description: Quaternion qw LISA solution
      - qx:
          type: f32
          description: Quaternion qx LISA solution
      - qy:
          type: f32
          description: Quaternion qy LISA solution
      - qz:
          type: f32
          description: Quaternion qz LISA solution
      - percentage:
          type: f32
          description: Percentage of close stars in LISA solution
      - nrCloseStars:
          type: u8
          unit: '#'
          description: Number of close stars in LISA solution
  - SolutionTRACK:
        id: 40
        communication_timeout_ms: 10
        fields:
        - qw:
            type: f32
            description: Quaternion qw tracking solution
        - qx:
            type: f32
            description: Quaternion qx tracking solution
        - qy:
            type: f32
            description: Quaternion qy tracking solution
        - qz:
            type: f32
            description: Quaternion qz tracking solution
        - confidence:
            type: f32
            description: Tracker Confidence Value
        - nrRemovedStars:
            type: u8
            unit: '#'
            description: Number of stars removed from tracking solution
  - Solution:
      id: 41
      communication_timeout_ms: 10
      fields:
      - attitude_qw:
          type: f32
          description: 'Quaternion qw taking into account the mounting'
      - attitude_qx:
          type: f32
          description: 'Quaternion qx taking into account the mounting'
      - attitude_qy:
          type: f32
          description: 'Quaternion qy taking into account the mounting'
      - attitude_qz:
          type: f32
          description: 'Quaternion qz taking into account the mounting'
      - rate_x:
          type: f32
          description: 'x-element of the estimated rate taking into account the mounting'
      - rate_y:
          type: f32
          description: 'y-element of the estimated rate taking into account the mounting'
      - rate_z:
          type: f32
          description: 'z-element of the estimated rate taking into account the mounting'
      - nrBlobs:
          type: u8
          description: Number of detected blobs
      - nrCentroids:
          type: u8
          description: Number of detected centroids
      - nrMatchedStars:
          type: u8
          unit: '#'
          description: Number of stars matched with db image
      - nrRemovedStars:
          type: u8
          unit: '#'
          description: Number of stars removed from tracking solution
      - confidence:
          type: f32
          description: Tracker Confidence Value
      - LISA_percentage:
          type: f32
          description: Percentage of close stars in LISA solution
      - LISA_nrCloseStars:
          type: u8
          unit: '#'
          description: Number of close stars in LISA solution
      - isTrustworthy:
          type: u8
          unit: bool
          description: 0=doesn't meet all validation criteria, 1=meets all validation criteria
            parameters
      - stableCount:
          type: u32
          unit: '#'
          description: Number of times we have a stable solution
      - solutionStrategy:
          type: u8
          unit: enum
          description: Algorithm path that was followed to determine the attitude
      - ticksAtCapture:
          type: u32
          description: Tick counter value in the middle of the image capture [ms]
      - timeAtCapture:
          type: u64
          description: Time in the middle of the image capture [µs]
  - Hardware:
      id: 42
      communication_timeout_ms: 10
      fields:
      - version:
          type: u8
          description: Hardware version
      - used_osc:
          type: u8
          description: Used to identify which oscillator is used. 0=unknown, 1=internal, 2=external, 3=internal as fallback

- additional_options:
    product_name: 'twinkle'
    default_communication_timeout_ms: 120